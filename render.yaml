services:
  - type: web
    name: tis-payslip
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: payslip-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
