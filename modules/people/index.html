<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人事管理 — TIS Back Office</title>
    <link rel="stylesheet" href="../../shared/shared.css">
    <link rel="stylesheet" href="../payslip/styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="portal-nav"></div>
<script src="../../shared/portal-nav.js"></script>

<div class="module-header">
    <div>
        <h1>人事管理</h1>
        <div class="subtitle">People Management — 員工基本資料及薪資設定</div>
    </div>
</div>

<div class="full-width" style="max-width:1200px; margin:0 auto; padding:24px;">
    <!-- Stats -->
    <div class="people-stats" id="peopleStats"></div>

    <div style="display:grid; grid-template-columns:420px 1fr; gap:24px; align-items:start;">
        <!-- Employee Form -->
        <div class="form-panel">
            <div id="empEditBanner" class="card" style="display:none; border-color: #f39c12;">
                <div class="card-body" style="background:#fef9e7; display:flex; justify-content:space-between; align-items:center;">
                    <span id="empEditBannerText" style="font-weight:600; color:#7d6608;"></span>
                    <button class="btn btn-sm btn-secondary" onclick="resetEmployeeForm()">取消編輯</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span class="icon">&#128100;</span> 員工基本資料</div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group"><label>員工姓名 *</label><input type="text" id="mEmpName" placeholder="王小明"></div>
                        <div class="form-group"><label>員工編號 *</label><input type="text" id="mEmpId" placeholder="TIS-001"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>部門</label><input type="text" id="mEmpDept" placeholder="研發部"></div>
                        <div class="form-group"><label>職稱</label><input type="text" id="mEmpTitle" placeholder="軟體工程師"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>到職日期</label><input type="date" id="mStartDate"></div>
                        <div class="form-group">
                            <label>狀態</label>
                            <select id="mStatus">
                                <option value="active">在職</option>
                                <option value="inactive">離職</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span class="icon">&#128176;</span> 固定薪資項目</div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group"><label>本薪</label><input type="text" class="money-input" id="mBaseSalary" value="0" inputmode="numeric"></div>
                        <div class="form-group"><label>伙食津貼</label><input type="text" class="money-input" id="mMealAllowance" value="0" inputmode="numeric"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>交通津貼</label><input type="text" class="money-input" id="mTransportAllowance" value="0" inputmode="numeric"></div>
                        <div class="form-group"><label>其他固定津貼</label><input type="text" class="money-input" id="mOtherAllowance" value="0" inputmode="numeric"></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span class="icon">&#128203;</span> 保險及勞退設定</div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>勞退自提比例</label>
                            <select id="mVoluntaryPensionRate">
                                <option value="0">0%（不自提）</option>
                                <option value="1">1%</option><option value="2">2%</option>
                                <option value="3">3%</option><option value="4">4%</option>
                                <option value="5">5%</option><option value="6">6%</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>健保眷屬人數</label>
                            <select id="mDependents">
                                <option value="0">0 人</option><option value="1">1 人</option>
                                <option value="2">2 人</option><option value="3">3 人</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="actions-bar">
                <button class="btn btn-success" style="flex:1" onclick="saveEmployee()">&#128190; 儲存員工</button>
                <button class="btn btn-secondary" style="flex:1" onclick="resetEmployeeForm()">&#128260; 重置</button>
            </div>
        </div>

        <!-- Employee List -->
        <div>
            <div class="card">
                <div class="card-header"><span class="icon">&#128101;</span> 員工名冊</div>
                <div class="card-body" style="padding:0; overflow-x:auto;">
                    <table class="entries-table">
                        <thead>
                            <tr>
                                <th>編號</th><th>姓名</th><th>部門</th><th>職稱</th>
                                <th>到職日</th><th>狀態</th>
                                <th class="amount">本薪</th><th class="amount">伙食</th>
                                <th class="amount">交通</th><th class="amount">其他</th>
                                <th>自提</th><th>眷屬</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="employeeListBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
